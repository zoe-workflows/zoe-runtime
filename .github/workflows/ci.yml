name: CI

# Runner-repository CI. The skill lives in `zoe-workflows`; tests that assert on
# its content resolve it through ZOE_SKILL_DIR and skip here. The cross-repo gate
# is `contract.yml`, which checks out the skill at a fixed tag.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is in the matrix on purpose: "works on bash" is not a
        # dual-platform claim (§3.2 item 6).
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: pip install -e '.[dev]'
      - name: Test
        run: pytest -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: pip install -e '.[dev]'
      - name: Lint
        run: ruff check .
      # 格式是**独立门禁**：`per-file-ignores` 只管 lint，不管格式。v1.4.0 时
      # 36 个文件已与 `ruff format` 漂移，而没有任何 job 会因此变红。
      - name: Format
        run: ruff format --check .

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install build tooling
        run: pip install build twine
      - name: Build sdist and wheel
        run: python -m build
      - name: Check metadata
        # Metadata only: `twine check` passing is not a test result.
        run: python -m twine check dist/*
      - name: Rebuild the wheel from the sdist
        run: |
          mkdir -p /tmp/sdist && tar -xzf dist/*.tar.gz -C /tmp/sdist
          cd /tmp/sdist/zoe_runtime-*
          python -m build --wheel --outdir /tmp/wheel-from-sdist
          ls -l /tmp/wheel-from-sdist
      - name: The sdist must not contain the skill
        run: |
          if tar -tzf dist/*.tar.gz | grep -E '/(SKILL\.md|references/|runtime-requirements\.json)' ; then
            echo "skill content leaked into the runtime sdist" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  install-artifact:
    name: install artifact (${{ matrix.os }})
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Install the wheel outside the source tree
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          if [ -f "$RUNNER_TEMP/venv/Scripts/python.exe" ]; then
            PY="$RUNNER_TEMP/venv/Scripts/python.exe"
          else
            PY="$RUNNER_TEMP/venv/bin/python"
          fi
          echo "DIST_PYTHON=$PY" >> "$GITHUB_ENV"
          "$PY" -m pip install --upgrade pip
          "$PY" -m pip install dist/*.whl
      - name: Install the test harness (not the runtime under test)
        run: python -m pip install pytest
      - name: Out-of-source smoke
        # `cd $RUNNER_TEMP` plus a scrubbed PYTHONPATH: if this imports `src/`,
        # the "installed" claim was false.
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          "$DIST_PYTHON" -m src --version
          "$DIST_PYTHON" -m src capabilities --json
      - name: Distribution proof (version, gate, demo guardrails)
        shell: bash
        run: ZOE_DIST_PYTHON="$DIST_PYTHON" pytest -q tests/test_distribution.py
